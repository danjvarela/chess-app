<import from="./square"></import>
<import from="./piece"></import>

<div
  class="ca:grid ca:grid-cols-8 ca:grid-rows-8 ca:w-full ca:h-full ca:relative"
>
  <template repeat.for="square of squares">
    <chess-square
      square.bind="square"
      dropzone-for.bind="possibleSquares.includes(square) ? pickedUpPiece.element : null"
    >
      <div show.bind="recentMoveSquares.includes(square)" class="ca:absolute ca:w-full ca:h-full ca:bg-amber-400/45"></div>
    </chess-square>
  </template>

  <template repeat.for="piece of piecesOnBoard">
    <chess-piece
      piece.bind="{type: piece.type, color: piece.color}"
      class="ca:absolute ca:w-1/8 ca:z-[20]"
      style.bind="pieceStyle(piece.square)"
      draggable
      draggable-pickup.trigger="onpickup($event, piece)"
      draggable-drop.trigger="ondrop($event, piece)"
    ></chess-piece>
  </template>
</div>
